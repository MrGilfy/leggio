# SPDX-License-Identifier: GPL-3.0-or-later
#
# Self-hosted Flatpak bundle, attached to each GitHub release.
#
# Build and install locally, from the top of the repository:
#
#   make flatpak
#
# The GNOME runtime already ships GTK 4, libadwaita, PyGObject and pycairo.
# It does not ship poppler-glib, so poppler is built here with only the GLib
# bindings and their introspection data enabled.

id: io.github.mrgilfy.leggio
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: leggio

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Scores are read where they already are; Leggio never writes to them.
  # Its own config, library and cache live in ~/.var/app/<id>/.
  - --filesystem=home:ro
  # Fallback idle inhibitor for sessions without the inhibit portal.
  - --talk-name=org.freedesktop.ScreenSaver

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/gir-1.0
  - /lib/cmake
  - "*.la"
  - "*.a"

modules:
  # Encoding and CMap data, so PDFs with CJK and other non-embedded
  # encodings render correctly.
  - name: poppler-data
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-data-0.4.12.tar.gz
        sha256: c835b640a40ce357e1b83666aabd95edffa24ddddd49b8daff63adb851cdab74

  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_GLIB=ON
      - -DENABLE_GOBJECT_INTROSPECTION=ON
      - -DENABLE_UTILS=OFF
      - -DENABLE_CPP=OFF
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DENABLE_BOOST=OFF
      - -DENABLE_NSS3=OFF
      - -DENABLE_GPGME=OFF
      - -DENABLE_LIBCURL=OFF
      - -DENABLE_GTK_DOC=OFF
      - -DBUILD_GTK_TESTS=OFF
      - -DBUILD_CPP_TESTS=OFF
      - -DBUILD_MANUAL_TESTS=OFF
      - -DBUILD_QT5_TESTS=OFF
      - -DBUILD_QT6_TESTS=OFF
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-26.10.0.tar.xz
        sha256: 6792cb7c69205007ad87d2e936cecc5b3a31fac29ab54ffc3175fdb6b2a6ce35

  - name: leggio
    buildsystem: simple
    build-commands:
      - make install PREFIX=/app
    sources:
      - type: dir
        path: ../..
        # Build output and caches that may sit in the checkout.
        skip:
          - .git
          - .flatpak-builder
          - .ruff_cache
          - .pytest_cache
          - build
          - flatpak_app
          - repo
