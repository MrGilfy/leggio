# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  source:
    name: Check and build the source tarball
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils appstream

      - name: Read the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with the version in the source would ship a
      # package whose AUR pkgver never matches what the app reports.
      - name: Check the tag matches the source version
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          src="$(make version)"
          echo "tag=$tag source=$src"
          if [ "$tag" != "$src" ]; then
            echo "::error::tag v$tag does not match __version__ $src"
            exit 1
          fi

      - name: Check the release is described in the metainfo
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "<release version=\"$version\"" \
              data/io.github.MrGilfy.Leggio.metainfo.xml; then
            echo "::error::no <release version=\"$version\"> in the metainfo"
            exit 1
          fi

      - name: Validate metadata
        run: |
          desktop-file-validate data/io.github.MrGilfy.Leggio.desktop
          appstreamcli validate --no-net \
            data/io.github.MrGilfy.Leggio.metainfo.xml

      # Reproducible: gzip -n omits the timestamp and filename that
      # `git archive --format=tar.gz` would otherwise embed. Without it two
      # runs of this workflow on the same commit produce different bytes and
      # therefore different checksums, so a re-run would silently invalidate
      # the sha256 already pasted into the PKGBUILD.
      - name: Build the source tarball
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar --prefix="leggio-$version/" HEAD \
            | gzip -n -9 > "leggio-$version.tar.gz"
          sha256sum "leggio-$version.tar.gz" | tee sha256.txt

      - name: Summarise for the AUR
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          sum="$(cut -d' ' -f1 sha256.txt)"
          {
            echo "### AUR update"
            echo
            echo "In \`packaging/leggio/PKGBUILD\`:"
            echo
            echo '```'
            echo "pkgver=$version"
            echo "sha256sums=('$sum')"
            echo '```'
            echo
            echo "This is the checksum of the attached asset, which is"
            echo "exactly what the PKGBUILD source line points at."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            leggio-*.tar.gz
            sha256.txt

  flatpak:
    name: Build the Flatpak bundle
    needs: source
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.MrGilfy.Leggio.yml
          bundle: leggio-${{ needs.source.outputs.version }}.flatpak
          artifact-name: flatpak
          # A release is built from scratch, never from a cached module.
          cache: false

  # Runs only when both builds succeeded, so a release never appears with
  # one of its assets missing.
  publish:
    name: Publish the release
    needs: [source, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List checksums for both assets
        working-directory: dist
        run: sha256sum leggio-*.tar.gz leggio-*.flatpak | tee sha256.txt

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/leggio-*.tar.gz
            dist/leggio-*.flatpak
            dist/sha256.txt
          generate_release_notes: true
