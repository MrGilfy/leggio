# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pipx install ruff

      - name: Lint
        run: ruff check src tests

      - name: Byte-compile
        run: python -m compileall -q src/leggio

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # System Python: pycairo and the Poppler bindings come from apt.
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pytest \
            python3-cairo \
            python3-gi-cairo \
            python3-gi \
            gir1.2-poppler-0.18

      - name: Run unit tests
        run: /usr/bin/python3 -m pytest -v

  metadata:
    name: Freedesktop metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils appstream

      - name: Validate desktop entry
        run: desktop-file-validate data/io.github.mrgilfy.leggio.desktop

      # --no-net: the screenshot lives in this repository, and on a pull
      # request from a fork it is not yet reachable at the raw.github URL.
      - name: Validate AppStream metainfo
        run: |
          appstreamcli validate --no-net \
            data/io.github.mrgilfy.leggio.metainfo.xml

  smoke:
    name: Headless start-up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-poppler-0.18 \
            xvfb

      - name: Start the application headlessly
        env:
          GDK_BACKEND: x11
          # The GL renderer has no usable device on a CI runner; the cairo
          # renderer draws the same tree in software.
          GSK_RENDERER: cairo
        run: xvfb-run -a python3 tests/smoke.py

  install:
    name: Install to a staging prefix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: make install
        run: make install DESTDIR="$PWD/stage" PREFIX=/usr

      - name: Check the installed layout
        run: |
          set -eu
          for f in \
            usr/bin/leggio \
            usr/lib/leggio/leggio/app.py \
            usr/lib/leggio/leggio/ui/icons/hicolor/scalable/actions/leggio-back-symbolic.svg \
            usr/lib/leggio/leggio/ui/icons/hicolor/24x24/actions/leggio-back-symbolic.symbolic.png \
            usr/share/applications/io.github.mrgilfy.leggio.desktop \
            usr/share/metainfo/io.github.mrgilfy.leggio.metainfo.xml \
            usr/share/icons/hicolor/scalable/apps/io.github.mrgilfy.leggio.svg \
            usr/share/icons/hicolor/128x128/apps/io.github.mrgilfy.leggio.png \
            usr/share/icons/hicolor/256x256/apps/io.github.mrgilfy.leggio.png \
            usr/share/licenses/leggio/LICENSE
          do
            test -e "stage/$f" || { echo "missing: $f"; exit 1; }
          done
          echo "installed layout is complete"

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.mrgilfy.leggio.yml
          bundle: leggio.flatpak
          artifact-name: leggio-flatpak
